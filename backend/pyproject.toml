[project]
name = "pinch-server"
version = "1.0.0"
description = "Self-hosted recipe backups and private sharing groups for Pinch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp>=1.30,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
