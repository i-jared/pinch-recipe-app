<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Join a cookbook · Pinch</title>
<style>body{margin:0;background:#f2f6f1;color:#17332c;font:18px system-ui,sans-serif;display:grid;min-height:100dvh;place-items:center}main{max-width:420px;padding:36px}header{font-size:64px}h1{font-size:36px;letter-spacing:-1px}p{line-height:1.6;color:#587068}a{display:block;padding:18px;border-radius:30px;text-align:center;background:#74c69d;color:#10291f;text-decoration:none;font-weight:700}small{display:block;margin-top:24px;color:#587068}</style>
<main><header>📖</header><h1>A cookbook for your people.</h1><p>You’ve been invited to a cookbook in Pinch. Open the app to see your invitation and join.</p><a id="open" hidden>Open invitation in Pinch</a><small id="help">Install Pinch on your phone, then return to this invitation. You can also paste this link into Cookbooks → Join a cookbook.</small></main>
<script>const code=location.hash.slice(1);if(/^[A-Za-z0-9_-]{1,128}$/.test(code)){const server=location.origin+location.pathname.replace(/\/join\/?$/,'');const a=document.getElementById('open');a.href='pinch://join?'+new URLSearchParams({server,code});a.hidden=false}else{document.getElementById('help').textContent='This invitation is incomplete. Ask the group owner for a new link.'}</script></html>
